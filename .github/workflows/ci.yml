name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guards (privacy, coins and money, dares, Play readiness)
        run: |
          bash scripts/check-service-privacy.sh
          bash scripts/check-coin-money-separation.sh
          bash scripts/check-dare-strings.sh
          bash scripts/check-play-readiness.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Cloud Functions tests
        working-directory: functions
        run: |
          npm ci
          npm test

  android:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Google services file for CI (a dummy; real builds use the real file)
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Release build compiles and R8 runs (unsigned check)
        run: ./gradlew :app:minifyReleaseWithR8 -x lint
