org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- App version. versionName is MAJOR.MINOR.PATCH; versionCode is made from the same numbers + BUILD (see app/build.gradle.kts).
# For every upload to Google Play raise BUILD (or let CI pass -PbuildNumber=$GITHUB_RUN_NUMBER). Never lower any of these.
VERSION_MAJOR=1
VERSION_MINOR=0
VERSION_PATCH=0
VERSION_BUILD=1
